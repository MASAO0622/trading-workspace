<title>套利总览仪表盘</title>
<style>

    --g1:#2b6cb0; --g2:#7c5cbf; --g3:#c8871a; --g4:#5b6b7a;
  }

    :root{ --bg:#141414; --card:#1d1d1d; --line:rgba(255,255,255,.12); --txt:#f0f0f0; --dim:#a5a5a5; --hint:#7a7a7a;

      --g1:#5b9bd5; --g2:#9b7fe0; --g3:#e0a53d; --g4:#8b9aa8; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    font-size:13.5px;line-height:1.5;padding:12px 12px 40px;padding-top:calc(12px + env(safe-area-inset-top));}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;flex-wrap:wrap}
  h1{font-size:16px;font-weight:600;margin:0}
  .tools{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  select,button{font:inherit;font-size:12px;color:var(--txt);background:var(--card);border:0.5px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer}
  a.lnk{font-size:12px;color:var(--acc);text-decoration:none}
  .stamp{font-size:11.5px;color:var(--hint);font-variant-numeric:tabular-nums;width:100%}
  .err{background:var(--stop);color:#fff;padding:7px 11px;border-radius:8px;font-size:12px;margin-bottom:8px;display:none}
  /* 总览条 */
  .sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
  @media (max-width:640px){ .sum{grid-template-columns:repeat(3,1fr)} }
  .stat{background:var(--card);border:0.5px solid var(--line);border-radius:10px;padding:9px 10px;position:relative}
  .stat .k{font-size:10.5px;color:var(--hint);letter-spacing:.5px}
  .stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat .s{font-size:10.5px;color:var(--dim);margin-top:1px}
  .stat.alert{border:1.5px solid var(--stop)}
  .stat.alert::after{content:'';position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--stop);animation:bl 1.1s infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
  /* 分组 */
  .grp{margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  .grp .bar{width:4px;height:16px;border-radius:2px}
  .grp .t{font-size:13.5px;font-weight:600}
  .grp .n{font-size:11px;color:var(--hint)}
  .grid{display:grid;grid-template-columns:1fr;gap:9px}
  @media (min-width:760px){ .grid{grid-template-columns:1fr 1fr} }
  @media (min-width:1180px){ .grid{grid-template-columns:1fr 1fr 1fr} }
  .card{background:var(--card);border:0.5px solid var(--line);border-radius:11px;padding:11px 12px;position:relative}
  .card.warn{border-left:3px solid var(--warn)}
  .card.stop{border-left:3px solid var(--stop)}
  .nm{font-size:13px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .nm .dir{font-size:10.5px;color:var(--hint);font-weight:400;text-align:right}
  .val{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
  .big{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
  .unit{font-size:10.5px;color:var(--hint)}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  .legs{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:5px;line-height:1.65}
  .legs b{font-weight:500;color:var(--txt)}
  .lines{margin-top:7px;display:flex;flex-direction:column;gap:3px}
  .ln{display:flex;align-items:center;gap:7px;font-size:11px;font-variant-numeric:tabular-nums}
  .ln .lab{color:var(--dim);min-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ln .bar{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:visible}
  .ln .bar i{position:absolute;top:-2.5px;width:2px;height:9px;border-radius:1px;background:var(--dim)}
  .ln .d{min-width:52px;text-align:right;color:var(--dim)}
  .ln.stop .lab,.ln.stop .d{color:var(--stop)} .ln.stop .bar i{background:var(--stop)}
  .ln.target .lab,.ln.target .d{color:var(--down)} .ln.target .bar i{background:var(--down)}
  .ln.near .bar i{background:var(--warn)} .ln.near .d{color:var(--warn);font-weight:600}
  .ln.hit .bar i{background:var(--stop)} .ln.hit .d{color:#fff;background:var(--stop);border-radius:4px;padding:0 4px;font-weight:600}
  details{margin-top:6px}
  details summary{font-size:10.5px;color:var(--acc);cursor:pointer;user-select:none;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details .note{font-size:11px;color:var(--hint);margin-top:5px;line-height:1.6;border-top:0.5px dashed var(--line);padding-top:6px}
  details .note b{color:var(--warn);font-weight:500}
  footer{margin:18px 2px 0;font-size:10.5px;color:var(--hint);line-height:1.8}
</style>

  let alerts=0;
  const secHtml=GRP.map(g=>{
    const list=CARDS.filter(c=>grpOf(c.name)===g);
    const cards=list.map(c=>{
      const A=Q[c.a.toUpperCase()], B=c.b?Q[c.b.toUpperCase()]:null;
      const spread=(A?A.last*+c.wa:NaN)-(B?B.last*+c.wb:NaN);
      const prev=lastSpread[c.name];
      const dSpr=(prev!==undefined&&!isNaN(spread))?spread-prev:NaN;
      lastSpread[c.name]=spread;
      const lv=parseLv(c.lv).slice(0,4);
      let cardCls='';
      const rows=lv.map(L=>{
        const dist=spread-L.v;
        if(isNaN(dist))return '';
        const near=Math.abs(dist)<(Math.abs(L.v)>500?2.5:1.2);
        const isStop=/止损|作废|死线|警戒|风险|禁做/i.test(L.label);
        const isTgt=/目标|T1|T2|止盈|清仓|门槛|入场区|触发区|回踩区|复核/i.test(L.label);
        let cls='';
        if(near){cls='hit';cardCls='stop';}
        else if(Math.abs(dist)<8){cls='near';cardCls=cardCls||'warn';}
        else if(isStop)cls='stop';
        else if(isTgt)cls='target';
        const span=Math.max(Math.abs(L.v)*0.06,10);
        const pos=Math.max(0,Math.min(100,50+dist/span*50));
        return `<div class="ln ${cls}"><span class="lab">${L.label} ${fmt(L.v)}</span>
          <span class="bar"><i style="left:${pos}%"></i></span>
          <span class="d">${dist>0?'+':''}${fmt(dist,Math.abs(dist)>=100?0:1)}</span></div>`;
      }).join('');
      if(cardCls==='stop')alerts++;
      [A,B].forEach(q=>{if(q&&q.date&&q.oi){const k=q.name+q.date;if(!base[k])base[k]={oi:q.oi,p:q.last};}});
      const dOi=q=>{if(!q||!q.date)return null;const b=base[q.name+q.date];return b?(q.oi-b.oi):null;};
      const leg=tag=>{
        const q=tag==='A'?A:B;
        if(!q)return '';
        const chg=q.preSettle?100*(q.last/q.preSettle-1):NaN;
        const doi=dOi(q);
        return `<b>${tag} ${q.name||''}</b> ${fmt(q.last)}（${!isNaN(chg)?(chg>0?'+':'')+chg.toFixed(2)+'%':'—'}）· 仓 ${fmt(q.oi,0)}${doi!==null?`（${doi>0?'+':''}${fmt(doi,0)}）`:''}`;
      };
      return `<div class="card ${cardCls}">
        <div class="nm"><span>${c.name}</span><span class="dir">${c.dir||''}</span></div>
        <div class="val"><span class="big ${!isNaN(dSpr)?(dSpr>0?'up':dSpr<0?'down':'flat'):''}">${isNaN(spread)?'—':fmt(spread)}</span>
          <span class="unit">现价差${isNaN(dSpr)?'':`（${dSpr>0?'+':''}${fmt(dSpr)}）`}</span></div>
        <div class="legs">${leg('A')}${B?`<br>${leg('B')}`:''}</div>
        ${rows?`<div class="lines">${rows}</div>`:''}
        <details><summary>备注 ▾</summary><div class="note">${c.note}</div></details>
      </div>`;
    }).join('');
    return `<div class="grp"><span class="bar" style="background:var(${g.c})"></span><span class="t">${g.t}</span><span class="n">${list.length} 张</span></div>
      <div class="grid">${cards}</div>`;
  }).join('');
  $('body').innerHTML=secHtml;
  const holds=CARDS.filter(c=>c.name.startsWith('【持仓】')).length;
  const done=CARDS.filter(c=>c.name.includes('【结案】')).length;
  $('sum').innerHTML=`
    <div class="stat"><div class="k">持仓</div><div class="v">${holds}</div><div class="s">TA-PX 2组 · AP 4组 · UR 2组</div></div>
    <div class="stat${alerts>0?' alert':''}"><div class="k">告警卡</div><div class="v">${alerts}</div><div class="s">贴线/穿越</div></div>
    <div class="stat"><div class="k">扳机待命</div><div class="v">${CARDS.filter(c=>c.name.startsWith('【扳机】')||c.name.startsWith('【触发】')).length}</div><div class="s">冷却期 21:39 起算</div></div>
    <div class="stat"><div class="k">极值</div><div class="v">${CARDS.filter(c=>c.name.startsWith('【极值】')).length}</div><div class="s">100%分位品种</div></div>
    <div class="stat"><div class="k">结案</div><div class="v">${done}</div><div class="s">PP +1,610 等</div></div>`;
  try{localStorage.setItem('spreadWatchBase_v1',JSON.stringify(base));}catch(e){}
}

async function tick(){
  try{
    const r=await fetch('/api/q?codes='+allCodes().join(','));
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    render(j.q,j.ts,j.src,j.missing);
  }catch(e){
    $('err').style.display='block';$('err').textContent='行情获取失败：'+e.message;
  }
}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';
  if(paused)clearInterval(timer);else{tick();timer=setInterval(tick,3000);}};
timer=setInterval(tick,3000);tick();
</script>
</body>
</html>
