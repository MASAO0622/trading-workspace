</head>
<body>
<header>
  <h1>套利价差盯盘</h1>
  <div class="tools">
    <a id="back" href="/" style="font-size:12px;color:var(--acc);text-decoration:none">← 持仓面板</a>
    <span style="font-size:12px;color:var(--dim)">每3秒刷新</span>
    <button id="pause">暂停</button>
    <button id="sound" class="off">铃声 关</button>
  </div>
  <div class="stamp" id="stamp">初始化…</div>
</header>
<div class="err" id="err"></div>
<div class="hintbox">
  <b>用法</b>：只盯「异常」——穿越关卡、价差异动、增减仓异常 → 报组合名，拿来找我做深度分析。关卡 = 重要点位（止损/目标/触发门槛），穿越即闪红+响铃；<b>触发条件以各卡备注的状态变量为准，价格只是执行位</b>。组合存本机浏览器。
</div>
<span class="fold" id="fold">＋ 添加 / 编辑组合 ▾</span>
<div class="form" id="form" style="display:none">
  <div class="fr">
    <div><label>组合名称</label><input class="wn" id="f_name" placeholder="【触发】CF 01-05"></div>
    <div><label>腿A 代码</label><input class="wl" id="f_a" placeholder="CF2701"></div>
    <div><label>A 系数</label><input class="wl" id="f_wa" value="1"></div>
    <div><label>腿B 代码(可空)</label><input class="wl" id="f_b" placeholder="CF2705"></div>
    <div><label>B 系数</label><input class="wl" id="f_wb" value="1"></div>
    <div><label>方向备注</label><input class="wn" id="f_dir" placeholder="反套观察"></div>
  </div>
  <div><label>关卡（每行一条：标签:价格，如「止损:620」「触发门槛:650」）</label>
  <textarea id="f_lv" placeholder="止损:620&#10;时间线11-27:600&#10;T1:430"></textarea></div>
  <div class="btns">
    <button class="save" id="f_save">保存组合</button>
    <button id="f_cancel">取消</button>
    <button id="f_del" style="display:none;color:var(--stop)">删除该组合</button>
  </div>
</div>
<div class="grid" id="list"></div>
<footer id="foot">
  数据源：新浪期货实时行情（经面板服务端转发）· 价差 = 腿A×系数A − 腿B×系数B · 涨红跌绿 ·

</footer>

{name:'【扳机】OI 1-5 反套 ⚠️崩塌中',a:'OI2701',wa:1,b:'OI2705',wb:1,dir:'新高 472 → 单日崩 35',
 lv:'11-24收:472(130日新高)\n11-25现:435\nμ=193 range 38~472\n仓单4,566张低位持平',
 note:'归因已立案：<b>01 增仓下跌</b>（11-23: 20.1万 → 11-24: 27.9万(+7.8万冲高回落) → 11-25: 29.4万，增仓打压近月=新空头进场）；仓单 4,566 张未回升（挤仓燃料仍在）。<b>崩塌中段不追（AL −415 漩涡教训）</b>。入场=反弹 460~480 受阻收阴 → 空 OI701+多 OI705 1组（10元/点）；止损=收盘收复 500（风险≈350~700元）；T1 400 / T2 350，中性看 250~300。作废线=仓单连 2 周回升 +1000 张/周 或 01 转减仓上涨（空头撤退）'},
{name:'【极值】RB 1-5',a:'RB2701',wa:1,b:'RB2705',wb:1,dir:'130日 100%分位 · 新高',
 lv:'历史高:44→现40\nμ=-16 σ=14\nrange -46~44',
 note:'螺纹近月历史新高（冬季刚需+宏观近强远弱）。归因待查：冬储节奏/钢厂减产/仓单。区间窄（±46）注意点值小波动大'},
{name:'【极值】HC 1-5',a:'HC2701',wa:1,b:'HC2705',wb:1,dir:'130日 100%分位 · 新高',
 lv:'历史高:-3（现值附近）\nμ=-17 σ=5\nrange -33~-3',
 note:'热卷近月与螺纹同步极值——黑色近强远弱是同一宏观结构，与 RB 视为同一仓位不可重复计。σ=5 极窄，滑点敏感'},
{name:'【极值】JM 1-5',a:'JM2701',wa:1,b:'JM2705',wb:1,dir:'128日 100%分位 · 新高',
 lv:'历史高:164\nμ=46 σ=57\nrange -60~164',
 note:'焦煤近月新高=低通关撑近月（与 J-JM 做阔放弃互证）。11-26 甘其毛都闭关 1 天，通关恢复情况是关键归因变量'},
{name:'【极值】EG 1-5',a:'EG2701',wa:1,b:'EG2705',wb:1,dir:'123日 100%分位 · 新高',
 lv:'夜盘21:03:550 续新高\n日盘收:531\nμ=134 σ=140\n⚠️01 OI转增仓上涨+7.8k',
 note:'乙二醇月差 531→550 续创新高。<b>属性转变</b>：11-24 减仓上涨（空头回补）→ 11-25 夜盘<b>增仓上涨 +7.8k（新多头进场）</b>——动能比空头回补更真实，回踩 430~450 可能给不出来。触发（回踩 430~450 不创新低+库存续去 → 做阔 1 组）保留但降级；<b>增仓新高不追</b>；若 01 转减仓或价差滞涨再评估'}
];
let combos; try{combos=JSON.parse(localStorage.getItem(LS))||seed();}catch(e){combos=seed();}
if(!combos.length)combos=seed();
let base={}; try{base=JSON.parse(localStorage.getItem('spreadWatchBase_v1'))||{};}catch(e){base={};}
let editing=null, paused=false, soundOn=false, timer=null, lastSpread={}, crossed=new Set();
const $=id=>document.getElementById(id);

function save(){localStorage.setItem(LS,JSON.stringify(combos));}
function saveBase(){localStorage.setItem('spreadWatchBase_v1',JSON.stringify(base));}
function parseLv(t){return (t||'').split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{
  const i=l.lastIndexOf(':'); if(i<0)return{label:l,v:NaN};
  return{label:l.slice(0,i).trim(),v:parseFloat(l.slice(i+1))};}).filter(x=>!isNaN(x.v));}
function comboCodes(c){return [c.a, c.b].filter(Boolean).map(s=>s.toUpperCase());}
function allCodes(){const s=new Set();combos.forEach(c=>comboCodes(c).forEach(x=>s.add(x)));return [...s];}
function fmt(n,d){if(isNaN(n))return '—';if(d!==undefined)return n.toFixed(d);
  if(Number.isInteger(n))return String(n);
  const dec=Math.abs(n)>=1000?0:(Math.abs(n)>=100?1:2);return n.toFixed(dec);}

function beep(){try{const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.001,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.45);
  o.start();o.stop(ac.currentTime+.5);}catch(e){}}

function calc(c,Q){
  const A=Q[c.a.toUpperCase()], B=c.b?Q[c.b.toUpperCase()]:null;
  const sa=A?A.last*+c.wa:NaN, sb=B?B.last*+c.wb:NaN;
  return {A,B,spread:sa-sb};
}

function render(Q,ts,src,missing){
  $('stamp').textContent=`更新 ${new Date(ts||Date.now()).toLocaleTimeString('zh-CN',{hour12:false})} · 源 ${src||'—'} · ${combos.length} 个组合`;
  if(missing&&missing.length){$('err').style.display='block';$('err').textContent='无行情合约：'+missing.join('、')+'（核对代码：品种+4位月，如 TA2701；未挂牌月份取不到属正常）';}
  else $('err').style.display='none';
  const html=combos.map(c=>{
    const {A,B,spread}=calc(c,Q||{});
    const prev=lastSpread[c.id];
    const dSpr=(prev!==undefined&&!isNaN(spread))?spread-prev:NaN;
    const lv=parseLv(c.lv);
    const chips=lv.map(L=>{
      const dist=spread-L.v;
      const was=crossed.has(c.id+'|'+L.label+L.v);
      const isNow=!isNaN(dist)&&Math.abs(dist)<(Math.abs(L.v)>500?2.5:1.2);
      const justCrossed=!was&&isNow;
      if(isNow)crossed.add(c.id+'|'+L.label+L.v); else crossed.delete(c.id+'|'+L.label+L.v);
      const cls='chip '+(isNow?'hit':(/止损|作废|警戒|风险/i.test(L.label)?'stop':(/目标|T1|T2|止盈/i.test(L.label)?'target':(Math.abs(dist)<8?'near':''))));
      return `<span class="${cls}" ${justCrossed?'data-x="1"':''}>${L.label} ${fmt(L.v)}（${!isNaN(dist)?(dist>0?'+':'')+fmt(dist,Math.abs(dist)>=100?0:1):'—'}）</span>`;
    }).join('');
    [A,B].forEach(q=>{if(q&&q.date&&q.oi){const k=q.name+q.date;if(!base[k])base[k]={oi:q.oi,p:q.last};}});
    const dOi=q=>{if(!q||!q.date)return null;const b=base[q.name+q.date];return b?(q.oi-b.oi):null;};
    const leg=tag=>{
      const q=tag==='A'?A:B;
      if(!q)return `<span style="color:var(--hint)">${tag}：—</span>`;
      const chg=q.preSettle?100*(q.last/q.preSettle-1):NaN;
      const doi=dOi(q);
      return `<b>${tag} ${q.name||''}</b> ${fmt(q.last)}（${!isNaN(chg)?(chg>0?'+':'')+chg.toFixed(2)+'%':'—'}）· 仓 ${fmt(q.oi,0)}${doi!==null?`（${doi>0?'+':''}${fmt(doi,0)}）`:''} · 量 ${fmt(q.vol,0)}`;
    };
    const alertCard = [...chips.matchAll(/data-x="1"/g)].length>0;
    if(alertCard&&soundOn&&prev!==undefined&&!isNaN(spread)&&Math.abs(spread-prev)>0.0001) beep();
    lastSpread[c.id]=spread;
    return `<div class="card${alertCard?' alert':''}">
      <div class="top"><div><div class="name">${c.name}${c.dir?` <span style="font-size:11.5px;color:var(--dim);font-weight:400">· ${c.dir}</span>`:''}</div>
        <div class="fml">${c.a}×${c.wa}${c.b?` − ${c.b}×${c.wb}`:'（单腿）'}</div></div>
        <div class="ops"><button data-ed="${c.id}">改</button></div></div>
      <div class="val"><span class="big ${!isNaN(dSpr)?(dSpr>0?'up':dSpr<0?'down':'flat'):''}">${isNaN(spread)?'—':fmt(spread)}</span>
        <span class="unit">现价差${isNaN(dSpr)?'':`（${dSpr>0?'+':''}${fmt(dSpr)}）`}</span></div>
      <div class="legs">${leg('A')}${c.b?`<br>${leg('B')}`:''}</div>
      ${chips?`<div class="lv">${chips}</div>`:''}
      ${c.note?`<div class="note">${c.note}</div>`:''}
    </div>`;
  }).join('');
  $('list').innerHTML=html||'<div class="empty">暂无组合，点上方「添加 / 编辑组合」新建</div>';
  saveBase();
}

async function tick(){
  const codes=allCodes();
  if(!codes.length){render({},Date.now(),'—');return;}
  try{
    const r=await fetch('/api/q?codes='+codes.join(','));
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    render(j.q,j.ts,j.src,j.missing);
  }catch(e){
    $('err').style.display='block';$('err').textContent='行情获取失败：'+e.message;
  }
}
function restart(){clearInterval(timer);timer=setInterval(tick,3000);}


$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';$('pause').classList.toggle('off',paused);
  if(paused)clearInterval(timer);else{tick();restart();}};
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'铃声 开':'铃声 关';$('sound').classList.toggle('off',!soundOn);if(soundOn)beep();};
$('fold').onclick=()=>{const f=$('form');const open=f.style.display==='none';f.style.display=open?'block':'none';
  $('fold').textContent=open?'－ 收起表单 ▴':'＋ 添加 / 编辑组合 ▾';};
$('f_cancel').onclick=()=>{editing=null;$('f_del').style.display='none';$('f_save').textContent='保存组合';
  ['f_name','f_a','f_b','f_lv','f_dir'].forEach(i=>$(i).value='');['f_wa','f_wb'].forEach(i=>$(i).value='1');};
$('f_del').onclick=()=>{if(!editing)return;combos=combos.filter(c=>c.id!==editing);save();$('f_cancel').onclick();tick();};
$('f_save').onclick=()=>{
  const c={id:editing||uid(),name:$('f_name').value.trim()||'未命名',
    a:$('f_a').value.trim().toUpperCase(),wa:+$('f_wa').value||1,
    b:$('f_b').value.trim().toUpperCase(),wb:+$('f_wb').value||1,
    dir:$('f_dir').value.trim(),lv:$('f_lv').value.trim(),note:''};
  if(!c.a){alert('腿A 代码必填');return;}
  if(editing){combos=combos.map(x=>x.id===editing?c:x);}else combos.push(c);
  save();$('f_cancel').onclick();tick();};
$('list').addEventListener('click',e=>{
  const id=e.target.dataset&&e.target.dataset.ed;
  if(!id)return;
  const c=combos.find(x=>x.id===id);if(!c)return;
  editing=id;
  $('form').style.display='block';$('fold').textContent='－ 收起表单 ▴';
  $('f_name').value=c.name;$('f_a').value=c.a;$('f_wa').value=c.wa;
  $('f_b').value=c.b||'';$('f_wb').value=c.wb;
  $('f_dir').value=c.dir||'';$('f_lv').value=c.lv||'';
  $('f_del').style.display='inline-block';$('f_save').textContent='保存修改';
  window.scrollTo({top:0,behavior:'smooth'});});
timer=setInterval(tick,3000);tick();
$('back').href = '/' + location.search; // 返回面板时保留授权参数
</script>
</body>
</html>
